name: Update Tesla News

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Tesla news
        run: python update_news.py

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes"
          else
            git commit -m "Auto-update Tesla news"
            git push
          fi
